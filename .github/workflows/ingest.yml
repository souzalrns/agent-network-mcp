name: Ingerir conhecimento

# LEGADO / ADAPTADOR (AU-06, decisão D-EP9 = A, 2026-10-03).
# A pipeline CANÓNICA de ingestão do RAG é o T6 do network-agents-setup
# (scripts/ingest_apply.py: MANIFEST versionado, content_hash, git_sha,
# knowledge_sources, project='network-agents-setup').
# Este workflow fica só para JSON do MCP (ingestion/*.json -> /api/ingest ->
# lib/knowledge.js ingestDocument): sem knowledge_sources, sem content_hash,
# chunker próprio (1500 chars) e linhas com project NULL.
# Conhecimento novo deve entrar pelo T6. Fundir as duas pipelines fica para
# depois do F1 (registo: network-agents-setup/docs/initiatives/PENDENCIAS.md).

# Dispara automaticamente sempre que um ficheiro novo/alterado aparecer na
# pasta ingestion/ — não precisas de fazer nada manualmente, isto corre
# sozinho a seguir a um git push feito pelo Claude ou por ti.

on:
  push:
    branches: [main]
    paths:
      - "ingestion/**.json"

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (H-003: Node 24, pinado por SHA; era @v4)
        with:
          fetch-depth: 2

      - name: Detetar ficheiros novos/alterados
        id: changed
        run: |
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          git diff --name-only HEAD~1 HEAD -- 'ingestion/*.json' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Enviar cada ficheiro para o endpoint de ingestão
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          for file in ${{ steps.changed.outputs.files }}; do
            echo "A ingerir: $file"
            curl -sf -X POST "$INGEST_URL" \
              -H "Content-Type: application/json" \
              -H "x-ingest-secret: $INGEST_SECRET" \
              --data-binary @"$file" \
              && echo "OK: $file" \
              || echo "FALHOU: $file"
          done
