name: Auditoria quinzenal de ferramentas gratuitas e dependências

# Corre a cada 14 dias. Duas frentes:
# 1) Verifica vulnerabilidades/dependências desatualizadas (Dependabot) em
#    TODOS os repositórios ativos do Luiz — não só nas ferramentas que
#    construímos, mas tudo o que está implantado em produção.
# 2) Procura repositórios novos/em alta em categorias amplas relevantes aos
#    negócios (scraping, APIs grátis, self-hosted, transcrição, mcp-server,
#    geração de imagem/vídeo, automação, CRM/formulários, PDF, etc.) e
#    confirma releases recentes das ferramentas gratuitas já em uso.
# Grava tudo no Supabase para o Claude analisar e reportar/incorporar
# diretamente na próxima conversa — sem custo, usa só a API pública do
# GitHub e do npm.

on:
  schedule:
    - cron: "0 10 1,15 * *" # dias 1 e 15 de cada mês, às 10h UTC
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verificar dependências, releases e novidades, gravar relatório
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT_ALL_REPOS: ${{ secrets.GH_PAT_ALL_REPOS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          pip install -q requests
          python3 << 'PYEOF'
          import json, os, requests
          from datetime import datetime, timedelta, timezone

          gh_headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
          }
          # PAT com acesso a todos os repos (necessário para Dependabot alerts
          # em repos que não são este; o GITHUB_TOKEN padrão só vê o próprio repo)
          gh_headers_all = {
              "Authorization": f"Bearer {os.environ['GH_PAT_ALL_REPOS']}",
              "Accept": "application/vnd.github+json",
          }

          # 0. Vulnerabilidades/dependências desatualizadas em TODOS os repos ativos
          active_repos = [
              "souzalrns/viannalegal-site",
              "souzalrns/mesaflow-api",
              "souzalrns/sst-portugal-site",
              "souzalrns/agent-network-mcp",
              "souzalrns/canidelo-vista-mar",
              "souzalrns/vistamar-gaia",
          ]
          dependency_alerts = []
          for repo in active_repos:
              try:
                  r = requests.get(
                      f"https://api.github.com/repos/{repo}/dependabot/alerts",
                      headers=gh_headers_all,
                      params={"state": "open", "per_page": 20},
                      timeout=15,
                  )
                  if r.ok:
                      alerts = r.json()
                      if alerts:
                          dependency_alerts.append({
                              "repo": repo,
                              "open_alerts": len(alerts),
                              "details": [
                                  {
                                      "package": a.get("dependency", {}).get("package", {}).get("name"),
                                      "severity": a.get("security_advisory", {}).get("severity"),
                                      "summary": a.get("security_advisory", {}).get("summary"),
                                      "url": a.get("html_url"),
                                  }
                                  for a in alerts[:10]
                              ],
                          })
                  elif r.status_code == 404:
                      pass  # repo não encontrado — ignora
                  elif r.status_code == 403:
                      dependency_alerts.append({
                          "repo": repo,
                          "open_alerts": None,
                          "note": "Dependabot alerts desativado neste repo — ativar em Settings > Security",
                      })
                  else:
                      print(f"Dependabot check falhou para {repo}: {r.status_code}")
              except Exception as e:
                  print(f"Falha ao verificar dependabot em {repo}: {e}")

          # 1. Releases recentes das ferramentas que já usamos no pipeline
          tracked_repos = [
              "yt-dlp/yt-dlp",
              "SYSTRAN/faster-whisper",
              "microsoft/playwright-python",
              "pollinations/pollinations",
          ]
          recent_releases = []
          for repo in tracked_repos:
              try:
                  r = requests.get(
                      f"https://api.github.com/repos/{repo}/releases/latest",
                      headers=gh_headers, timeout=15,
                  )
                  if r.ok:
                      d = r.json()
                      recent_releases.append({
                          "repo": repo,
                          "tag": d.get("tag_name"),
                          "published_at": d.get("published_at"),
                          "name": d.get("name"),
                          "url": d.get("html_url"),
                      })
              except Exception as e:
                  print(f"Falha ao verificar {repo}: {e}")

          # 2. Repositórios novos/em alta em categorias amplas (últimos 14 dias)
          since = (datetime.now(timezone.utc) - timedelta(days=14)).strftime("%Y-%m-%d")
          topics_queries = [
              f"topic:web-scraping created:>{since} stars:>20",
              f"topic:free-api created:>{since} stars:>10",
              f"topic:self-hosted created:>{since} stars:>50",
              f"topic:transcription created:>{since} stars:>10",
              f"topic:mcp-server created:>{since} stars:>10",
              f"topic:image-generation created:>{since} stars:>20",
              f"topic:ai-image-generation created:>{since} stars:>15",
              f"topic:video-generation created:>{since} stars:>15",
              f"topic:text-to-video created:>{since} stars:>15",
              f"topic:text-to-image created:>{since} stars:>15",
              f"topic:stable-diffusion created:>{since} stars:>20",
              f"topic:workflow-automation created:>{since} stars:>30",
              f"topic:ai-agents created:>{since} stars:>50",
              f"topic:crm created:>{since} stars:>20",
              f"topic:invoice-generator created:>{since} stars:>10",
              f"topic:pdf-generation created:>{since} stars:>15",
              f"topic:e-signature created:>{since} stars:>10",
              f"topic:whatsapp-api created:>{since} stars:>15",
              f"topic:vector-database created:>{since} stars:>30",
              f"topic:seo-tools created:>{since} stars:>10",
              f"topic:chatbot created:>{since} stars:>30",
              f"topic:nestjs created:>{since} stars:>20",
          ]
          trending = []
          for q in topics_queries:
              try:
                  r = requests.get(
                      "https://api.github.com/search/repositories",
                      headers=gh_headers,
                      params={"q": q, "sort": "stars", "order": "desc", "per_page": 5},
                      timeout=15,
                  )
                  if r.ok:
                      for item in r.json().get("items", []):
                          trending.append({
                              "name": item["full_name"],
                              "description": item.get("description"),
                              "stars": item["stargazers_count"],
                              "url": item["html_url"],
                              "query": q,
                          })
              except Exception as e:
                  print(f"Falha na query '{q}': {e}")

          report = {
              "dependency_alerts": dependency_alerts,
              "recent_releases": recent_releases,
              "trending_repos": trending,
              "generated_at": datetime.now(timezone.utc).isoformat(),
          }

          supabase_url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]

          resp = requests.post(
              f"{supabase_url}/rest/v1/tool_scan_reports",
              headers={
                  "apikey": key,
                  "Authorization": f"Bearer {key}",
                  "Content-Type": "application/json",
                  "Prefer": "return=representation",
              },
              data=json.dumps({"report": report, "reviewed": False}),
              timeout=30,
          )
          resp.raise_for_status()
          print("Relatório gravado no Supabase:")
          print(json.dumps(report, ensure_ascii=False, indent=2)[:3000])

          # Reaproveita a limpeza automática de espaço
          cleanup_resp = requests.post(
              f"{supabase_url}/rest/v1/rpc/cleanup_old_transcripts_if_needed",
              headers={
                  "apikey": key,
                  "Authorization": f"Bearer {key}",
                  "Content-Type": "application/json",
              },
              data="{}",
              timeout=30,
          )
          cleanup_resp.raise_for_status()
          PYEOF
