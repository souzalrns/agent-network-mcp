name: Buscar registo Supabase (temporário)

on:
  workflow_dispatch:
    inputs:
      table:
        description: "Tabela"
        required: true
        default: "transcripts"
        type: string
      filter:
        description: "Query string PostgREST (ex: url=ilike.*abc*)"
        required: true
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Buscar e publicar como Issue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULT=$(curl -s "$SUPABASE_URL/rest/v1/${{ inputs.table }}?${{ inputs.filter }}" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          echo "$RESULT" > result.json
          gh issue create --title "fetch-result-${{ github.run_id }}" --body-file result.json --repo ${{ github.repository }}
