name: Verificacao de seguranca (temporario)

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Testar se rota protegida exige login
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "=== Testando https://vianna-gestao.vercel.app/ sem cookies de sessao ===" > result.txt
          HTTP_CODE=$(curl -s -o body.html -w "%{http_code}" "https://vianna-gestao.vercel.app/")
          echo "HTTP status final (apos seguir redirects, se houver): $HTTP_CODE" >> result.txt
          echo "" >> result.txt
          echo "URL final apos redirects:" >> result.txt
          curl -s -o /dev/null -w "%{url_effective}\n" -L "https://vianna-gestao.vercel.app/" >> result.txt
          echo "" >> result.txt
          echo "=== Headers (sem seguir redirect, so a primeira resposta) ===" >> result.txt
          curl -s -D - -o /dev/null "https://vianna-gestao.vercel.app/" >> result.txt
          echo "" >> result.txt
          echo "=== Primeiros 800 caracteres do corpo final ===" >> result.txt
          head -c 800 body.html >> result.txt

          cat result.txt
          gh issue create --title "security-check-${{ github.run_id }}" --body-file result.txt --repo souzalrns/agent-network-mcp
