name: Transcrever vídeo/reel

# Dispara manualmente (ou via API) passando uma URL de vídeo — YouTube,
# Instagram, TikTok, Twitter/X, Facebook e +1800 sites suportados pelo
# yt-dlp. Baixa só o áudio, transcreve com faster-whisper (modelo "base",
# roda em CPU) e grava o resultado na tabela public.transcripts do Supabase
# (projeto agent-network-memory) — histórico acumulado, custo zero.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL do vídeo/reel/post a transcrever"
        required: true
        type: string

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Instalar dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -q --upgrade yt-dlp faster-whisper requests

      - name: Baixar, transcrever e gravar no Supabase
        env:
          VIDEO_URL: ${{ inputs.url }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 << 'PYEOF'
          import json, os, subprocess, requests
          from faster_whisper import WhisperModel
          from urllib.parse import urlparse

          url = os.environ["VIDEO_URL"]

          def yt_field(field):
              try:
                  out = subprocess.run(
                      ["yt-dlp", "--skip-download", "--print", f"%({field})s", url],
                      capture_output=True, text=True, timeout=60
                  )
                  return out.stdout.strip()
              except Exception:
                  return ""

          title = yt_field("title")
          uploader = yt_field("uploader")
          description = yt_field("description")

          host = urlparse(url).netloc.lower()
          if "instagram" in host:
              platform = "instagram"
          elif "youtu" in host:
              platform = "youtube"
          elif "tiktok" in host:
              platform = "tiktok"
          elif "twitter" in host or host == "x.com":
              platform = "twitter"
          else:
              platform = host or "desconhecido"

          subprocess.run(
              ["yt-dlp", "-x", "--audio-format", "mp3", "--audio-quality", "5",
               "-o", "audio.%(ext)s", url],
              check=True, timeout=300
          )

          model = WhisperModel("base", device="cpu", compute_type="int8")
          segments, info = model.transcribe("audio.mp3", language=None, vad_filter=True)
          transcript = " ".join(seg.text.strip() for seg in segments)

          row = {
              "url": url,
              "platform": platform,
              "title": title,
              "uploader": uploader,
              "description": description,
              "language": info.language,
              "language_probability": round(info.language_probability, 3),
              "transcript": transcript,
          }

          supabase_url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]

          resp = requests.post(
              f"{supabase_url}/rest/v1/transcripts",
              headers={
                  "apikey": key,
                  "Authorization": f"Bearer {key}",
                  "Content-Type": "application/json",
                  "Prefer": "return=representation",
              },
              data=json.dumps(row),
              timeout=30,
          )
          resp.raise_for_status()
          print("Gravado no Supabase com sucesso:")
          print(json.dumps(resp.json(), ensure_ascii=False, indent=2))

          # Verifica consumo de espaço e apaga os mais antigos se ultrapassar 70% do limite free tier
          cleanup_resp = requests.post(
              f"{supabase_url}/rest/v1/rpc/cleanup_old_transcripts_if_needed",
              headers={
                  "apikey": key,
                  "Authorization": f"Bearer {key}",
                  "Content-Type": "application/json",
              },
              data="{}",
              timeout=30,
          )
          cleanup_resp.raise_for_status()
          print("Verificação de limpeza automática:")
          print(json.dumps(cleanup_resp.json(), ensure_ascii=False, indent=2))
          PYEOF
