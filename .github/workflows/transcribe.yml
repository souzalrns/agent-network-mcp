name: Transcrever vídeo/reel

# Dispara manualmente (ou via API) passando uma URL de vídeo — YouTube,
# Instagram, TikTok, Twitter/X, Facebook e +1800 sites suportados pelo
# yt-dlp. Baixa só o áudio, transcreve com faster-whisper (modelo "base",
# roda em CPU) e grava o resultado em transcripts/latest.json no repo.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL do vídeo/reel/post a transcrever"
        required: true
        type: string

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -q --upgrade yt-dlp faster-whisper

      - name: Baixar, transcrever e gravar resultado
        env:
          VIDEO_URL: ${{ inputs.url }}
        run: |
          python3 << 'PYEOF'
          import json, os, subprocess
          from faster_whisper import WhisperModel

          url = os.environ["VIDEO_URL"]

          def yt_field(field):
              try:
                  out = subprocess.run(
                      ["yt-dlp", "--skip-download", "--print", f"%({field})s", url],
                      capture_output=True, text=True, timeout=60
                  )
                  return out.stdout.strip()
              except Exception:
                  return ""

          title = yt_field("title")
          uploader = yt_field("uploader")
          description = yt_field("description")

          subprocess.run(
              ["yt-dlp", "-x", "--audio-format", "mp3", "--audio-quality", "5",
               "-o", "audio.%(ext)s", url],
              check=True, timeout=300
          )

          model = WhisperModel("base", device="cpu", compute_type="int8")
          segments, info = model.transcribe("audio.mp3", language=None, vad_filter=True)
          transcript = " ".join(seg.text.strip() for seg in segments)

          result = {
              "url": url,
              "title": title,
              "uploader": uploader,
              "description": description,
              "language": info.language,
              "language_probability": round(info.language_probability, 3),
              "transcript": transcript,
          }

          os.makedirs("transcripts", exist_ok=True)
          with open("transcripts/latest.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(json.dumps(result, ensure_ascii=False, indent=2))
          PYEOF

      - name: Commit resultado
        run: |
          git config user.name "transcribe-bot"
          git config user.email "actions@github.com"
          git add transcripts/latest.json
          git commit -m "chore: resultado de transcrição — ${{ inputs.url }}" || echo "Nada para commitar"
          git push
